AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Native Blue/Green Deployment with Lifecycle Hooks - Complete Infrastructure'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the deployment
    Default: vpc-0d0d50dd9874861fd
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for ECS tasks (minimum 2)
    Default: "subnet-0f5117f3d913a3f24,subnet-031621fca876e52c7"
  ImageUri:
    Type: String
    Description: ECR image URI for the application
    Default: "965990104809.dkr.ecr.us-east-2.amazonaws.com/ecs-bluegreen-demo:v1.0"

Resources:
  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  # IAM Roles
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ECSExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-LambdaExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ECSLifecycleHookPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ECS Blue/Green Role
  ECSBlueGreenRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ECSBlueGreenRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSBlueGreenPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - lambda:InvokeFunction
                Resource: '*'

  # Lifecycle Hook Lambda Function
  LifecycleHookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lifecycle-hook"
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Environment:
        Variables:
          TEST_ENDPOINT_URL: !Sub "http://${ApplicationLoadBalancer.DNSName}:8080"
          PRODUCTION_ENDPOINT_URL: !Sub "http://${ApplicationLoadBalancer.DNSName}"
      Code:
        ZipFile: |
          import json
          import urllib3
          import logging
          import os
          import time
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          http = urllib3.PoolManager()
          
          def lambda_handler(event, context):
              logger.info("=== ECS Deployment Lifecycle Hook Triggered ===")
              logger.info(f"Event: {json.dumps(event, default=str)}")
              
              try:
                  # Get the lifecycle stage
                  lifecycle_stage = event.get('lifecycleStage', 'UNKNOWN')
                  logger.info(f"Lifecycle stage: {lifecycle_stage}")
                  
                  if lifecycle_stage == 'POST_TEST_TRAFFIC_SHIFT':
                      return validate_green_environment()
                  elif lifecycle_stage == 'PRODUCTION_TRAFFIC_SHIFT':
                      return validate_production_switch()
                  else:
                      logger.info(f"No specific validation for stage: {lifecycle_stage}")
                      return {"hookStatus": "SUCCEEDED"}
                      
              except Exception as error:
                  logger.error(f"Hook error: {str(error)}")
                  return {"hookStatus": "FAILED"}
          
          def validate_green_environment():
              """Validate the Green environment via test traffic"""
              logger.info("=== Validating Green Environment ===")
              
              test_endpoint = os.getenv('TEST_ENDPOINT_URL')
              if not test_endpoint:
                  logger.error("TEST_ENDPOINT_URL not configured")
                  return {"hookStatus": "FAILED"}
              
              logger.info(f"Testing Green environment at: {test_endpoint}")
              
              # Retry validation with backoff
              for attempt in range(3):
                  try:
                      logger.info(f"Validation attempt {attempt + 1}/3")
                      
                      # Test health endpoint
                      health_response = http.request('GET', f"{test_endpoint}/health", timeout=30)
                      logger.info(f"Health check status: {health_response.status}")
                      
                      if health_response.status == 200:
                          # Test main application
                          app_response = http.request('GET', test_endpoint, timeout=30)
                          logger.info(f"App response status: {app_response.status}")
                          
                          if app_response.status == 200:
                              logger.info("✅ Green environment validation successful")
                              return {"hookStatus": "SUCCEEDED"}
                      
                      if attempt < 2:
                          logger.info("Retrying in 15 seconds...")
                          time.sleep(15)
                          
                  except Exception as e:
                      logger.warning(f"Validation attempt {attempt + 1} failed: {str(e)}")
                      if attempt < 2:
                          time.sleep(15)
              
              logger.error("❌ Green environment validation failed")
              return {"hookStatus": "FAILED"}
          
          def validate_production_switch():
              """Validate that production traffic switch is ready"""
              logger.info("=== Validating Production Traffic Switch ===")
              
              # For production switch, we just ensure the previous validation passed
              # The actual traffic switching is handled by ECS
              logger.info("✅ Ready for production traffic switch")
              return {"hookStatus": "SUCCEEDED"}

  # Lambda Permission for ECS
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LifecycleHookFunction
      Action: lambda:InvokeFunction
      Principal: ecs.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !Ref ECSExecutionRole
      ContainerDefinitions:
        - Name: demo-app
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 80
          Environment:
            - Name: APP_VERSION
              Value: v1.0
            - Name: ENVIRONMENT
              Value: Blue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # CloudWatch Log Group
  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 7

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref ALBSecurityGroup]

  # Target Groups
  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-blue"
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-green"
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Listeners - Fixed for proper Blue/Green
  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup  # Initially route to Blue
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup  # Test traffic always goes to Green
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP

  # Listener Rules for Blue/Green - Fixed
  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup  # Initially Blue gets production traffic
      Conditions:
        - Field: path-pattern
          Values: ["/*"]
      ListenerArn: !Ref ProductionListener
      Priority: 1

  TestListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup  # Green gets test traffic
      Conditions:
        - Field: path-pattern
          Values: ["/*"]
      ListenerArn: !Ref TestListener
      Priority: 1

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"
  
  LoadBalancerDNS:
    Description: Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"
  
  ProductionURL:
    Description: Production URL (Port 80)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-ProductionURL"
  
  TestURL:
    Description: Test URL (Port 8080)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}:8080"
    Export:
      Name: !Sub "${AWS::StackName}-TestURL"
  
  BlueTargetGroupArn:
    Description: Blue Target Group ARN
    Value: !Ref BlueTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-BlueTargetGroupArn"
  
  GreenTargetGroupArn:
    Description: Green Target Group ARN
    Value: !Ref GreenTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-GreenTargetGroupArn"
  
  ProductionListenerRuleArn:
    Description: Production Listener Rule ARN
    Value: !Ref ProductionListenerRule
    Export:
      Name: !Sub "${AWS::StackName}-ProductionListenerRuleArn"
  
  TestListenerRuleArn:
    Description: Test Listener Rule ARN
    Value: !Ref TestListenerRule
    Export:
      Name: !Sub "${AWS::StackName}-TestListenerRuleArn"
  
  ECSBlueGreenRoleArn:
    Description: ECS Blue/Green Role ARN
    Value: !GetAtt ECSBlueGreenRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECSBlueGreenRoleArn"
  
  LambdaFunctionArn:
    Description: Lifecycle Hook Lambda Function ARN
    Value: !GetAtt LifecycleHookFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionArn"
  
  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-TaskDefinitionArn"
